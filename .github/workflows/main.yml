name: Build and Push to ACR

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4 # Updated to v4 for better performance

    - name: Azure Login
      uses: azure/login@v2 # Updated to v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Build and Push to ACR
      run: |
        az acr login --name lucyacr01
        # We use github.run_id for easier tracking in the Azure Portal
        docker build -t lucyacr01.azurecr.io/python-api:${{ github.run_id }} .
        docker push lucyacr01.azurecr.io/python-api:${{ github.run_id }}